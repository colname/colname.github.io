<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YJUN羽毛球">
  <meta name="theme-color" content="#07111f">
  <meta name="format-detection" content="telephone=no">
  <title>YJUN羽毛球管理工具</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./assets/app.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand">🏸 YJUN羽毛球</div>
        <div class="subtitle" id="sessionSubtitle">排赛、计分与排名</div>
      </div>
      <button class="icon-btn" id="newSessionBtn" title="新建活动">＋</button>
    </header>

    <section class="view active" id="setupView">
      <div class="hero">
        <span class="eyebrow">一个场地 · 每场四人</span>
        <h1>生成公平赛程</h1>
        <p>先保证每人场次完全一致，再依次优化搭档、对手和连续出场。</p>
      </div>

      <form class="panel form-panel" id="scheduleForm">
        <label>
          <span>活动名称</span>
          <input id="sessionName" maxlength="40" placeholder="例如：周末羽毛球">
        </label>
        <label>
          <span>男生姓名</span>
          <textarea id="malePlayers" rows="3" placeholder="空格、逗号或换行分隔"></textarea>
        </label>
        <label>
          <span>女生姓名</span>
          <textarea id="femalePlayers" rows="3" placeholder="空格、逗号或换行分隔"></textarea>
        </label>
        <label>
          <span>比赛场数</span>
          <select id="matchCount">
            <option value="auto">自动推荐</option>
            <option value="6">6 场</option>
            <option value="9">9 场</option>
            <option value="12">12 场</option>
            <option value="14">14 场</option>
            <option value="15">15 场</option>
            <option value="21">21 场</option>
          </select>
        </label>
        <button class="primary-btn" type="submit" id="generateBtn">生成公平赛程</button>
      </form>

      <section id="schedulePreview" class="hidden"></section>
    </section>

    <section class="view" id="scoreView">
      <div id="scoreEmpty" class="empty panel">请先生成或从历史中打开一个活动。</div>
      <div id="scoreContent" class="hidden">
        <section class="progress-panel">
          <div class="progress-row">
            <strong id="progressText"></strong>
            <span id="doneText"></span>
          </div>
          <div class="progress-bar"><div id="progressBar"></div></div>
        </section>

        <section class="match-card" id="swipeArea">
          <div class="match-head">
            <span class="badge" id="roundBadge"></span>
            <span class="match-type" id="typeText"></span>
          </div>
          <div class="teams">
            <div class="team" id="leftTeam"></div>
            <div class="versus">VS</div>
            <div class="team" id="rightTeam"></div>
          </div>
          <div class="score-grid">
            <div class="score-box">
              <div class="score" id="scoreA">0</div>
              <div class="stepper">
                <button type="button" data-score-side="a" data-delta="-1">－</button>
                <button type="button" data-score-side="a" data-delta="1">＋</button>
              </div>
              <div class="presets">
                <button type="button" data-score-side="a" data-value="10">10</button>
                <button type="button" data-score-side="a" data-value="15">15</button>
                <button type="button" data-score-side="a" data-value="18">18</button>
                <button type="button" data-score-side="a" data-value="21">21</button>
              </div>
            </div>
            <div class="score-colon">:</div>
            <div class="score-box">
              <div class="score" id="scoreB">0</div>
              <div class="stepper">
                <button type="button" data-score-side="b" data-delta="-1">－</button>
                <button type="button" data-score-side="b" data-delta="1">＋</button>
              </div>
              <div class="presets">
                <button type="button" data-score-side="b" data-value="10">10</button>
                <button type="button" data-score-side="b" data-value="15">15</button>
                <button type="button" data-score-side="b" data-value="18">18</button>
                <button type="button" data-score-side="b" data-value="21">21</button>
              </div>
            </div>
          </div>
          <div class="timer" id="timer">00:00</div>
          <button class="primary-btn" type="button" id="startBtn">▶ 开始本场</button>
          <button class="secondary-btn hidden" type="button" id="pauseBtn">⏸ 暂停</button>
          <button class="finish-btn" type="button" id="finishBtn">✓ 完成本场并进入下一场</button>
        </section>

        <div class="round-nav">
          <button type="button" id="prevBtn">← 上一场</button>
          <button type="button" id="nextBtn">下一场 →</button>
        </div>
      </div>
    </section>

    <section class="view" id="overviewView">
      <div id="overviewEmpty" class="empty panel">暂无活动数据。</div>
      <div id="overviewContent" class="hidden">
        <section class="panel">
          <div class="section-head">
            <div>
              <h2>个人排名</h2>
              <span id="rankingStatus"></span>
            </div>
            <button class="small-btn" id="shareBtn">分享图片</button>
          </div>
          <div class="ranking-head">
            <span>名次</span><span>队员</span><span>胜</span><span>负</span><span>净胜分</span>
          </div>
          <div id="rankingList"></div>
          <p class="note">胜场优先；胜场相同按净胜分排序。仅统计已完成的有效比分。</p>
        </section>

        <section class="panel quality-panel" id="qualityPanel"></section>

        <section class="panel">
          <div class="section-head">
            <h2>全部赛程</h2>
            <button class="small-btn" id="copyBtn">复制记录</button>
          </div>
          <div class="round-list" id="roundList"></div>
        </section>
      </div>
    </section>

    <section class="view" id="historyView">
      <div class="section-head standalone">
        <div>
          <span class="eyebrow">保存在当前设备</span>
          <h1>活动历史</h1>
        </div>
      </div>
      <div id="historyList"></div>
    </section>
  </main>

  <nav class="bottom-tabs" aria-label="主导航">
    <button class="active" data-view="setup">排赛</button>
    <button data-view="score">计分</button>
    <button data-view="overview">赛程排名</button>
    <button data-view="history">历史</button>
  </nav>

  <div class="toast" id="toast"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
